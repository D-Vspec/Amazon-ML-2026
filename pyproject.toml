[project]
name = "business-entity-resolution"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anyascii>=0.3.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/er"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]  # so tests can import main.py
