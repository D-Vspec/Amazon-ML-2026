[project]
name = "business-entity-resolution"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anyascii>=0.3.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "torch>=2.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/er"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]  # so tests can import main.py

# CUDA 12.8 builds of PyTorch (needed for the RTX 50xx / Blackwell GPU); everything else comes from PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
