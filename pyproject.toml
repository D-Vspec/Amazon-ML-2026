[project]
name = "business-entity-resolution"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anyascii>=0.3.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "torch>=2.11.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/er"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "py-spy>=0.4.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]  # so tests can import main.py
filterwarnings = [  # same informational torch warnings silenced in er/blockers/tfidf.py
    "ignore:Sparse invariant checks are implicitly disabled:UserWarning",
    "ignore:Sparse CSR tensor support is in beta state:UserWarning",
]

# CUDA 12.8 builds of PyTorch (needed for the RTX 50xx / Blackwell GPU); everything else comes from PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
